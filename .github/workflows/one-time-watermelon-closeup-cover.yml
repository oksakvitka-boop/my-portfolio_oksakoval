name: Publish Watermelon Royale close-up cover
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-watermelon-closeup-cover.yml'

permissions:
  contents: write

jobs:
  extract-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install FFmpeg
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg

      - name: Extract matching original-resolution close-up frame
        shell: bash
        run: |
          set -euo pipefail
          original="assets/ai-video/watermelon-royale-original.mp4"
          cover="assets/ai-video/watermelon-royale-closeup-cover.webp"
          test -s "$original"
          ffmpeg -hide_banner -loglevel error -y \
            -i "$original" -vf 'select=eq(n\,229)' \
            -vsync 0 -frames:v 1 \
            -c:v libwebp -quality 100 -compression_level 6 "$cover"
          test -s "$cover"
          w=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$cover")
          h=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$cover")
          test "$w" = 1080 && test "$h" = 1920
          echo "Saved original-size cover from video frame 229."

      - name: Commit only the new cover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ai-video/watermelon-royale-closeup-cover.webp
          git commit -m "Add close-up ring-on-watermelon cover frame"
          git push origin HEAD:main
