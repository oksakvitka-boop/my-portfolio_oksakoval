name: Update Ruby Heart cover frame
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-ruby-heart-cover.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install FFmpeg for frame extraction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Replace only Ruby Heart thumbnail from matching video frame
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/ai-video/ruby-heart.mp4
          ffmpeg -hide_banner -loglevel error -ss 20.30 -i assets/ai-video/ruby-heart.mp4 -frames:v 1 -q:v 2 -y assets/ai-video/ruby-heart-cover.jpg
          file assets/ai-video/ruby-heart-cover.jpg
          test -s assets/ai-video/ruby-heart-cover.jpg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ai-video/ruby-heart-cover.jpg
          if git diff --cached --quiet; then
            echo "Cover already matches requested frame"
            exit 0
          fi
          git commit -m 'Replace Ruby Heart cover with meadow portrait frame'
          git push origin HEAD:main
