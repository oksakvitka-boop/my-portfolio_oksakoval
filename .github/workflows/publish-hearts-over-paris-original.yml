name: Publish original Hearts Over Paris video
on:
  push:
    branches: [main]
    paths:
      - 'assets/ai-video/.hearts-over-paris-parts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-full-quality-original:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reassemble original MP4 without re-encoding and verify SHA-256
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          segments = Path("assets/ai-video/.hearts-over-paris-parts")
          output = Path("assets/ai-video/hearts-over-paris-original.mp4")
          parts = sorted(segments.glob("part-*.b64"))
          expected_size = 41676081
          expected_hash = "36a9b8ee72e88a2ac2400833826daed3e8bc37acb6cb78fee828b2a2773051a1"
          if not parts and output.is_file():
              print("Original file already assembled; nothing to do.")
              raise SystemExit(0)
          if len(parts) != 56:
              raise SystemExit(f"Expected 56 parts; found {len(parts)}")

          total = 0
          digest = hashlib.sha256()
          with output.open("wb") as f:
              for part in parts:
                  chunk = base64.b64decode(part.read_text(encoding="ascii").strip(), validate=True)
                  total += len(chunk)
                  digest.update(chunk)
                  f.write(chunk)
          if total != expected_size or digest.hexdigest() != expected_hash:
              output.unlink(missing_ok=True)
              raise SystemExit(f"Mismatch: {total} bytes, SHA256 {digest.hexdigest()}")
          print(f"Verified original video: {total} bytes; SHA256 {digest.hexdigest()}")
          PY

      - name: Commit original MP4 and remove temporary transfer parts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/ai-video/hearts-over-paris-original.mp4
          if [ -d assets/ai-video/.hearts-over-paris-parts ]; then
            git rm -r assets/ai-video/.hearts-over-paris-parts
          fi
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Publish full-quality Hearts Over Paris film"
            git push origin HEAD:main
          fi
