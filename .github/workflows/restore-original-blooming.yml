name: Restore original Blooming Elegance video

on:
  push:
    branches: [main]
    paths:
      - 'assets/ai-video/.blooming-original-parts/**'

permissions:
  contents: write

jobs:
  restore-original-video:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reassemble and verify original MP4 bytes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          folder = Path("assets/ai-video/.blooming-original-parts")
          files = sorted(folder.glob("part-*.b64"))
          if len(files) != 15:
              raise SystemExit(f"Expected 15 original-byte segments, found {len(files)}")

          encoded = "".join(p.read_text(encoding="ascii") for p in files)
          source = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(source).hexdigest()
          expected = "dee2c213200846ff95088b5afe4c7bef3d408dcaec8aa8d0297145fa1ce4d355"
          if len(source) != 36597689 or digest != expected:
              raise SystemExit(f"Original MP4 validation failed: bytes={len(source)}, sha256={digest}")

          destination = Path("assets/ai-video/blooming-elegance.mp4")
          destination.write_bytes(source)
          print(f"Verified original video, {len(source)} bytes, SHA-256 {digest}")
          PY

      - name: Publish source MP4 and remove temporary transfer segments
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/ai-video/blooming-elegance.mp4
          git rm -r assets/ai-video/.blooming-original-parts
          git commit -m "Restore full-quality original Blooming Elegance video"
          git push
