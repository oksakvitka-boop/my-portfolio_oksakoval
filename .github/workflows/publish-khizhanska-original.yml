name: Publish Khizhanska original mineral water video
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-khizhanska-original.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-original-video:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reassemble source MP4 byte for byte and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path("assets/ai-video")
          pieces = sorted((root / ".khizhanska-video-parts").glob("part-*.bin"))
          result = root / "khizhanska-mountain-water-original.mp4"
          expected_length = 28631110
          expected_sha = "fa9619a56cf56497ba974ce86976f88743039ba31a0bb3bb2055d143f80f2adf"
          cover = root / "khizhanska-mountain-water-cover.webp"
          expected_cover_sha = "d2aa4c96be12ca9fd3aa7cf6c46617d36daf0f2593d7332cad9c5acee523e84b"

          if not cover.is_file() or hashlib.sha256(cover.read_bytes()).hexdigest() != expected_cover_sha:
              raise SystemExit("Cover does not match original user image")
          if not pieces and result.exists():
              actual = hashlib.sha256(result.read_bytes()).hexdigest()
              if result.stat().st_size == expected_length and actual == expected_sha:
                  print("Original movie already published and verified")
                  raise SystemExit(0)
          if len(pieces) != 28:
              raise SystemExit(f"Expected 28 original-byte movie parts, found {len(pieces)}")
          h = hashlib.sha256()
          size = 0
          with result.open("wb") as out:
              for part in pieces:
                  data = part.read_bytes()
                  size += len(data)
                  h.update(data)
                  out.write(data)
          if size != expected_length or h.hexdigest() != expected_sha:
              result.unlink(missing_ok=True)
              raise SystemExit(f"Original MP4 mismatch: bytes={size}, SHA256={h.hexdigest()}")
          print(f"Original unchanged movie verified: bytes={size}, SHA256={h.hexdigest()}")
          PY

      - name: Publish original movie and remove temporary pieces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/ai-video/khizhanska-mountain-water-original.mp4
          if [ -d assets/ai-video/.khizhanska-video-parts ]; then
            git rm -r assets/ai-video/.khizhanska-video-parts
          fi
          if git diff --cached --quiet; then
            echo "Nothing further to publish"
          else
            git commit -m "Publish original uncompressed Khizhanska mineral water film"
            git push origin HEAD:main
          fi
