<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#201c21">
  <meta name="description" content="Golden Orchard — AI відеореклама ювелірного виробу. Відеоробота у портфоліо.">
  <title>Golden Orchard | AI Jewelry Film</title>
  <style>
    :root{color-scheme:dark;--pink:#b76d80;--ink:#f7f0f2}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100svh;background:#171418;color:var(--ink);display:flex;flex-direction:column}
    .viewer-top{z-index:3;position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,4.5vw,72px);border-bottom:1px solid rgba(255,255,255,.13);background:#241c22}
    .back{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:11px 18px;border:1px solid #deaab9;border-radius:99px;background:#b76d80;color:white;font-size:13px;font-weight:700;text-decoration:none;transition:background .2s}
    .back:hover{background:#965365}
    .back:focus-visible{outline:3px solid #ffd0dd;outline-offset:3px}
    .viewer-kicker{font-size:10px;letter-spacing:.16em;font-weight:700;text-transform:uppercase;color:#e9b3c3;text-align:right}
    .viewer-main{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 16px 24px;gap:14px}
    .viewer-player{width:min(100%,calc((100svh - 154px)*.5625));aspect-ratio:9 / 16;max-height:calc(100svh - 154px);position:relative;overflow:hidden;background:linear-gradient(155deg,#9d798a,#261c28 75%);box-shadow:0 12px 46px rgba(0,0,0,.4)}
    video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
    .viewer-player .media-error{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:32px;text-align:center;background:#201b23;font-size:14px;line-height:1.7;color:#f3e6e9}
    .viewer-player.is-error video{display:none}
    .viewer-player.is-error .media-error{display:flex}
    .caption{text-align:center;max-width:540px;margin:0}
    h1{font:italic 400 clamp(24px,3.5vw,34px)/1.1 Georgia,'Times New Roman',serif;margin:0 0 4px}
    .description{color:#cbb7c1;font-size:12px;letter-spacing:.08em;margin:0}
    @media(max-width:600px){
      .viewer-top{padding:9px 14px}
      .back{padding:9px 13px;font-size:12px}
      .viewer-kicker{font-size:9px}
      .viewer-main{padding:10px 10px 18px;gap:12px}
      .viewer-player{width:min(100%,calc((100svh - 138px)*.5625));max-height:calc(100svh - 138px)}
    }
  </style>
</head>
<body>
  <header class="viewer-top">
    <a class="back" href="index.html#ai" aria-label="Повернутися назад до портфоліо"><span aria-hidden="true">←</span> Назад до портфоліо</a>
    <span class="viewer-kicker">AI VIDEO / JEWELRY FILM</span>
  </header>
  <main class="viewer-main">
    <div class="viewer-player" id="playerArea">
      <video id="film" controls playsinline autoplay preload="auto" aria-label="Golden Orchard — відеопрезентація ювелірного виробу">
        <source src="assets/ai-video/golden-orchard.mp4" type="video/mp4">
        Ваш браузер не підтримує відео HTML5.
      </video>
      <div class="media-error" role="status">
        Відео поки недоступне на сайті. Після завантаження файлу Golden Orchard у портфоліо ролик відтворюватиметься тут.
      </div>
    </div>
    <div class="caption">
      <h1>Golden Orchard</h1>
      <p class="description">AI JEWELRY · PRODUCT FILM · 9:16</p>
    </div>
  </main>
  <script>
    const film=document.getElementById('film');
    const playerArea=document.getElementById('playerArea');
    film.addEventListener('error',()=>playerArea.classList.add('is-error'));
    film.addEventListener('playing',()=>playerArea.classList.remove('is-error'));
    document.addEventListener('keydown',(e)=>{
      if(e.key==='Escape'){window.location.href='index.html#ai'}
    });
    // Some browsers block autoplay with sound; native controls remain visible for manual playback.
    window.addEventListener('load',()=>{const attempt=film.play();if(attempt&&attempt.catch)attempt.catch(()=>{})});
  </script>
</body>
</html>
